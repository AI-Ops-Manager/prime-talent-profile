name: Render

on:
  push:
    branches: [main]
    paths:
      - "talents/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "対象のtalent slug（空なら全件）"
        required: false
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 日本語フォントを導入
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 依存関係をインストール
        run: npm ci

      - name: スキーマ検証
        run: npm run check

      - name: 描画
        # 入力値はシェルに直接展開せず、環境変数経由で渡す（スクリプトインジェクション対策）
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          if [ -n "$SLUG" ]; then
            npm run render -- "$SLUG" --allow-overflow
          else
            npm run render -- --all --allow-overflow
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: |
            out/**/*.pdf
            out/**/render.json
          retention-days: 14
